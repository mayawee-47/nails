
<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAYA GAL NAILS — Nail Designer</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap');

:root{
  --red:#a90d18;
  --dark:#551d22;
  --pink:#fff5f5;
  --line:#efd9dc;
  --soft:#fffafa;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--soft);
  color:var(--dark);
  font-family:"Noto Sans Thai",sans-serif;
}

header{
  min-height:70px;
  background:var(--red);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 7%;
  box-shadow:0 4px 18px #700a1420;
}

.logo{
  font-family:Georgia,serif;
  font-size:31px;
  font-weight:bold;
}

.logo small{
  font-family:"Noto Sans Thai",sans-serif;
  font-size:14px;
  font-weight:400;
  margin-left:8px;
}

main{
  width:min(1000px,94%);
  margin:auto;
  padding:30px 0 60px;
}

.intro{
  text-align:center;
  margin-bottom:22px;
}

.intro h1{
  margin:4px 0;
  color:#8f0a14;
  font-size:clamp(28px,5vw,44px);
}

.intro p{
  color:#7d6265;
  margin:5px;
}

.steps{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:6px;
  margin-bottom:20px;
}

.step{
  font-size:11px;
  color:#a99194;
  text-align:center;
}

.step b{
  display:grid;
  place-items:center;
  width:29px;
  height:29px;
  margin:auto;
  border-radius:50%;
  background:#eadbdd;
}

.step.active,.step.done{color:var(--red)}
.step.active b,.step.done b{background:var(--red);color:#fff}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:24px;
  padding:24px;
  box-shadow:0 15px 45px #78101a12;
}

.card h2{
  text-align:center;
  margin:0 0 20px;
}

.shape-container, .color-container {
  display: flex;
  flex-direction: column;
  gap: 15px;
  margin-bottom: 20px;
}

.shape-main-img, .color-main-img {
  width: 100%;
  border-radius: 16px;
  border: 1px solid var(--line);
  display: block;
}

.shape-buttons {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 8px;
}

.color-buttons {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 8px;
}

.shape-btn, .color-btn {
  background: #fff;
  border: 1px solid var(--line);
  padding: 10px 4px;
  border-radius: 10px;
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
  color: var(--dark);
  transition: all .2s;
  text-align: center;
}

.shape-btn:hover, .shape-btn.selected,
.color-btn:hover, .color-btn.selected {
  background: var(--red);
  color: #fff;
  border-color: var(--red);
  box-shadow: 0 4px 12px #a90d1830;
  transform: translateY(-2px);
}

.gallery{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.gallery.five{
  grid-template-columns:repeat(5,1fr);
}

.option{
  border:1px solid var(--line);
  background:#fff;
  border-radius:16px;
  padding:9px;
  cursor:pointer;
  color:var(--dark);
  transition:.2s;
}

.option:hover,.option.selected{
  border-color:var(--red);
  box-shadow:0 6px 15px #a90d1820;
  transform:translateY(-2px);
}

.option img{
  display:block;
  width:100%;
  height:145px;
  object-fit:cover;
  border-radius:11px;
}

.gallery.five .option img{height:125px}

.option strong{
  display:block;
  text-align:center;
  padding:8px 3px 2px;
  font-size:14px;
}

.option small{
  display:block;
  text-align:center;
  color:#8b7073;
}

.preview{
  background:#f8ecea;
  border-radius:19px;
  padding:18px;
  margin-bottom:20px;
}

.preview-title{
  text-align:center;
  font-weight:700;
  color:var(--red);
  margin-bottom:12px;
}

.preview-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.preview-item{
  background:#fff;
  border-radius:12px;
  overflow:hidden;
  border:1px solid var(--line);
}

.preview-item img{
  width:100%;
  height:130px;
  object-fit:cover;
  display:block;
}

.preview-item span{
  display:block;
  text-align:center;
  padding:7px 4px;
  font-size:12px;
  font-weight:600;
}

.summary{
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
  margin:15px 0;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:10px 14px;
  border-bottom:1px solid #f3e6e8;
  font-size:14px;
}

.row:last-child{border:0}

.row-image{
  width:70px;
  height:55px;
  object-fit:cover;
  border-radius:8px;
}

.deposit{
  text-align:center;
  background:#fff6f6;
  border:1px solid var(--line);
  padding:18px;
  border-radius:16px;
}

.deposit strong{
  display:block;
  color:var(--red);
  font-size:32px;
}

.bank{
  text-align:left;
  margin-top:14px;
  padding:15px;
  border:1px solid var(--line);
  border-radius:15px;
}

.bank strong{
  font-size:21px;
  color:#8e0914;
}

.upload{
  margin-top:15px;
  border:2px dashed #d79ca2;
  min-height:190px;
  border-radius:16px;
  background:#fffafa;
  display:grid;
  place-items:center;
  text-align:center;
  overflow:hidden;
  cursor:pointer;
  color:var(--red);
  padding:12px;
}

.upload input{display:none}

.upload img{
  width:100%;
  max-height:330px;
  object-fit:contain;
  border-radius:10px;
}

.upload-text strong,.upload-text span{
  display:block;
}

.upload-text span{
  font-size:14px;
  margin-top:4px;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.primary,.secondary{
  flex:1;
  padding:13px;
  border-radius:12px;
  cursor:pointer;
  font:inherit;
  font-weight:bold;
}

.primary{
  background:var(--red);
  color:#fff;
  border:1px solid var(--red);
}

.secondary{
  background:#fff;
  color:var(--red);
  border:1px solid #c99096;
}

.primary:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.notice{
  margin-top:14px;
  background:#eef8f1;
  color:#267346;
  padding:12px;
  border-radius:12px;
  text-align:center;
  font-weight:bold;
}

.saved-images{
  margin-top:18px;
  border:1px solid var(--line);
  border-radius:16px;
  padding:15px;
  background:#fffafa;
}

.saved-images h3{
  margin:0 0 12px;
  color:var(--red);
}

.saved-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.saved-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:10px;
  overflow:hidden;
}

.saved-card img{
  width:100%;
  height:100px;
  object-fit:cover;
  display:block;
}

.saved-card span{
  display:block;
  padding:6px;
  text-align:center;
  font-size:11px;
}

.terms{
  margin-top:18px;
  background:var(--red);
  color:#fff;
  border-radius:16px;
  padding:15px;
  font-size:13px;
}

.terms h3{margin:0}
.terms ul{margin:6px 0 0;padding-left:20px}

@media(max-width:700px){
  .steps{grid-template-columns:repeat(3,1fr);row-gap:10px}
  .gallery,.gallery.five{grid-template-columns:repeat(2,1fr)}
  .preview-grid{grid-template-columns:repeat(2,1fr)}
  .saved-grid{grid-template-columns:repeat(2,1fr)}
  .card{padding:17px}
  .option img,.gallery.five .option img{height:135px}
  .shape-buttons{grid-template-columns:repeat(4, 1fr);}
  .color-buttons{grid-template-columns:repeat(6, 1fr);}
}

@media(max-width:430px){
  .gallery,.gallery.five{grid-template-columns:1fr 1fr}
  .actions{flex-direction:column}
  .row{font-size:13px}
  .shape-buttons{grid-template-columns:repeat(3, 1fr);}
  .color-buttons{grid-template-columns:repeat(4, 1fr);}
}
</style>
</head>

<body>

<header>
  <div class="logo">maya <small>gal nails</small></div>
  <div>MAYA GAL NAILS</div>
</header>

<main>
  <section class="intro">
    <p>MAYA GAL NAILS</p>
    <h1>ออกแบบลายเล็บในแบบของคุณ</h1>
    <p>เลือกทุกองค์ประกอบ โดยใช้ภาพตัวอย่างจริง และบันทึกภาพแยกตามแต่ละขั้นตอน</p>
  </section>

  <div class="steps" id="steps"></div>
  <section class="card" id="app"></section>
</main>

<script>
"use strict";

const shapeGuideImage = "https://i.pinimg.com/736x/d5/4e/13/d54e138d81ff6dabe3d50ca1a3f9a839.jpg";
const colorGuideImage = "https://d.lnwfile.com/_/d/_raw/pc/3s/zd.jpg";

const shapes = [
  { id: "round", name: "ROUND (ทรงกลม)", image: shapeGuideImage },
  { id: "oval", name: "OVAL (ทรงโอวอล)", image: shapeGuideImage },
  { id: "square", name: "SQUARE (ทรงเหลี่ยม)", image: shapeGuideImage },
  { id: "squoval", name: "SQUOVAL (ทรงเหลี่ยมมน)", image: shapeGuideImage },
  { id: "almond", name: "ALMOND (ทรงอัลมอนด์)", image: shapeGuideImage },
  { id: "coffin", name: "COFFIN (ทรงคอฟฟิน)", image: shapeGuideImage },
  { id: "stiletto", name: "STILETTO (ทรงสติลเลตโต)", image: shapeGuideImage }
];

// สร้างรายการสี 01 ถึง 48
const colors = Array.from({ length: 48 }, (_, i) => {
  const code = String(i + 1).padStart(2, '0');
  return {
    id: `color-${code}`,
    name: `รหัส ${code}`,
    image: colorGuideImage
  };
});

const arts = [
  {id:"plain",name:"เพ้นปลาย",image:"https://www.akerufeed.com/wp-content/uploads/2024/11/93943478ef2c3c107872827a47c484b7.jpg"},
  {id:"line",name:"เพ้นจุดโฟลกาดอท",image:"https://www.lemon8-app.com/seo/image?item_id=7500943132884861457&index=1&sign=f8dd8f4a89a64d7dc6748692e8f5fddf"},
  {id:"heart",name:"เพ้นหัวใจ",image:"https://www.lemon8-app.com/seo/image?item_id=7324964043234935297&index=0&sign=a38f04de52d190523cfafd0c93911703"},
  {id:"flower",name:"เพ้นดาว",image:"https://files.vogue.co.th/uploads/IMG_9766orgkoprgk_(33).JPG"},
  {id:"bow",name:"เพ้นโบว์",image:"https://images.unsplash.com/photo-1607779097040-26e80aa78e66?auto=format&fit=crop&w=700&q=85"},
  {id:"grid",name:"เพ้นลายไฟ",image:"https://files.vogue.co.th/uploads/Flame-nails-idea_(6).jpg"},
];

const accessories = [
  {id:"diamond",name:"เพชร",image:"https://www.lemon8-app.com/seo/image?item_id=7484154516947059216&index=0&sign=708b1465169b421b4b8d7997b6150a04"},
  {id:"pearl",name:"มุก",image:"https://s.isanook.com/wo/0/ui/39/198817/n4.jpg"},
  {id:"flower",name:"ดอกไม้",image:"https://do.lnwfile.com/_/do/_raw/41/ii/ia.jpg"},
  {id:"bow",name:"โบว์",image:"https://d.lnwfile.com/_/d/_raw/mu/v1/rh.jpg"},
  {id:"heart",name:"หัวใจ",image:"https://do.lnwfile.com/_/do/_raw/gw/c9/6i.jpg"},
];

let step = 1;
let slip = null;

let design = {
  shape: shapes[0],
  color: colors[0],
  art: arts[0],
  accessory: accessories[0]
};

const labels = [
  "รูปทรงเล็บ",
  "โทนสี",
  "ลายเพ้นท์",
  "อะไหล่",
  "ตรวจสอบ",
  "วางมัดจำ"
];

function $(selector){
  return document.querySelector(selector);
}

function renderSteps(){
  $("#steps").innerHTML = labels.map((label,index)=>{
    const number = index + 1;
    return `
      <div class="step ${number===step ? "active":""} ${number<step ? "done":""}">
        <b>${number}</b>
        ${label}
      </div>
    `;
  }).join("");
}

function preview(){
  const items = [
    ["รูปทรงเล็บ",design.shape],
    ["โทนสี",design.color],
    ["ลายเพ้นท์",design.art],
    ["อะไหล่",design.accessory]
  ];

  return `
    <div class="preview">
      <div class="preview-title">ภาพที่เลือกแยกตามข้อมูล</div>
      <div class="preview-grid">
        ${items.map(([label,item])=>`
          <div class="preview-item">
            <img src="${item.image}" alt="${item.name}">
            <span>${label}: ${item.name}</span>
          </div>
        `).join("")}
      </div>
    </div>
  `;
}

function gallery(list,type,columns=""){
  return `
    <div class="gallery ${columns}">
      ${list.map(item=>`
        <button
          class="option ${item.id===design[type].id ? "selected":""}"
          onclick="choose('${type}','${item.id}')"
          type="button"
        >
          <img src="${item.image}" alt="${item.name}" loading="lazy">
          <strong>${item.name}</strong>
          <small>ภาพตัวอย่างจริง</small>
        </button>
      `).join("")}
    </div>
  `;
}

function actions(back,next,nextText="ถัดไป"){
  return `
    <div class="actions">
      ${back ? `<button class="secondary" type="button" onclick="go(${back})">ย้อนกลับ</button>` : ""}
      ${next ? `<button class="primary" type="button" onclick="go(${next})">${nextText}</button>` : ""}
    </div>
  `;
}

function render(){
  renderSteps();
  let html = "";

  if(step===1){
    html = `
      <h2>ขั้นตอนที่ 1 — เลือกรูปทรงเล็บ</h2>
      <div class="shape-container">
        <img class="shape-main-img" src="${shapeGuideImage}" alt="ตัวอย่างรูปทรงเล็บ">
        <div class="shape-buttons">
          ${shapes.map(item => `
            <button 
              type="button" 
              class="shape-btn ${item.id === design.shape.id ? 'selected' : ''}"
              onclick="choose('shape', '${item.id}')"
            >
              ${item.id.toUpperCase()}
            </button>
          `).join('')}
        </div>
      </div>
      ${actions(null,2)}
    `;
  }

  if(step===2){
    html = `
      <h2>ขั้นตอนที่ 2 — เลือกโทนสี</h2>
      <div class="color-container">
        <img class="color-main-img" src="${colorGuideImage}" alt="ผังตารางสี">
        <div class="color-buttons">
          ${colors.map(item => `
            <button 
              type="button" 
              class="color-btn ${item.id === design.color.id ? 'selected' : ''}"
              onclick="choose('color', '${item.id}')"
            >
              ${item.name.replace('รหัส ', '')}
            </button>
          `).join('')}
        </div>
      </div>
      ${preview()}
      ${actions(1,3)}
    `;
  }

  if(step===3){
    html = `
      <h2>ขั้นตอนที่ 3 — เลือกลายเพ้นท์</h2>
      ${gallery(arts,"art","five")}
      ${preview()}
      ${actions(2,4)}
    `;
  }

  if(step===4){
    html = `
      <h2>ขั้นตอนที่ 4 — เลือกอะไหล่</h2>
      ${gallery(accessories,"accessory","five")}
      ${preview()}
      ${actions(3,5,"ตรวจสอบแบบ")}
    `;
  }

  if(step===5){
    html = `
      <h2>ขั้นตอนที่ 5 — ตรวจสอบข้อมูล</h2>
      ${preview()}

      <div class="summary">
        <div class="row">
          <span>รูปทรงเล็บ</span>
          <div>
            <b>${design.shape.name}</b><br>
            <img class="row-image" src="${design.shape.image}" alt="${design.shape.name}">
          </div>
        </div>

        <div class="row">
          <span>โทนสี</span>
          <div>
            <b>${design.color.name}</b><br>
            <img class="row-image" src="${design.color.image}" alt="${design.color.name}">
          </div>
        </div>

        <div class="row">
          <span>ลายเพ้นท์</span>
          <div>
            <b>${design.art.name}</b><br>
            <img class="row-image" src="${design.art.image}" alt="${design.art.name}">
          </div>
        </div>

        <div class="row">
          <span>อะไหล่</span>
          <div>
            <b>${design.accessory.name}</b><br>
            <img class="row-image" src="${design.accessory.image}" alt="${design.accessory.name}">
          </div>
        </div>
      </div>

      <div class="saved-images">
        <h3>ข้อมูลรูปภาพที่จะแยกเก็บ</h3>
        <div class="saved-grid">
          <div class="saved-card">
            <img src="${design.shape.image}" alt="ขั้นตอน 1">
            <span>ขั้นตอน 1 รูปทรง</span>
          </div>
          <div class="saved-card">
            <img src="${design.color.image}" alt="ขั้นตอน 2">
            <span>ขั้นตอน 2 สี</span>
          </div>
          <div class="saved-card">
            <img src="${design.art.image}" alt="ขั้นตอน 3">
            <span>ขั้นตอน 3 ลาย</span>
          </div>
          <div class="saved-card">
            <img src="${design.accessory.image}" alt="ขั้นตอน 4">
            <span>ขั้นตอน 4 อะไหล่</span>
          </div>
        </div>
      </div>

      ${actions(4,6,"ยืนยันแบบและวางมัดจำ")}
    `;
  }

  if(step===6){
    html = `
      <h2>ขั้นตอนที่ 6 — วางมัดจำ</h2>

      <div class="deposit">
        จำนวนเงินมัดจำ
        <strong>500 บาท</strong>
      </div>

      <div class="bank">
        <small>โอนเงินเข้าบัญชี</small><br>
        <strong>999-9-99999-9</strong><br>
        <b>MAYA GAL NAILS</b>
      </div>

      <p>หลังโอนเงิน กรุณาแนบสลิปเป็นรูปภาพ เพื่อยืนยันการจองคิว</p>

      <label class="upload" id="upload">
        <input id="slipInput" type="file" accept="image/*">
        ${
          slip
          ? `<img src="${slip.dataUrl}" alt="สลิปโอนเงิน">`
          : `<div class="upload-text">
               <strong>แนบสลิปโอนเงิน</strong>
               <span>แตะหรือคลิกเพื่อเลือกรูปภาพ</span>
             </div>`
        }
      </label>

      ${
        slip
        ? `<div class="notice">แนบสลิปเรียบร้อยแล้ว: ${escapeHtml(slip.name)}</div>`
        : ""
      }

      <div class="actions">
        <button class="secondary" type="button" onclick="go(5)">ย้อนกลับ</button>
        <button class="primary" type="button" ${slip ? "" : "disabled"} onclick="confirmPayment()">
          ยืนยันการชำระเงิน
        </button>
      </div>

      <div class="terms">
        <h3>เงื่อนไขการวางมัดจำ</h3>
        <ul>
          <li>มัดจำ 500 บาท / คิว</li>
          <li>มัดจำไม่สามารถคืนได้หากยกเลิกกะทันหัน</li>
          <li>กรุณาแนบสลิปหลังชำระเงินเพื่อยืนยันคิว</li>
        </ul>
      </div>
    `;
  }

  $("#app").innerHTML = html;

  const input = $("#slipInput");
  if(input){
    input.addEventListener("change",handleSlip);
  }
}

function choose(type,id){
  const lists = {
    shape:shapes,
    color:colors,
    art:arts,
    accessory:accessories
  };

  const list = lists[type];
  const item = list.find(entry=>entry.id===id);

  if(item){
    design[type] = item;
    saveStepImage(type,item);
  }

  render();
}

function go(number){
  step = number;
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function handleSlip(event){
  const input = event.target;
  const file = input.files && input.files[0];

  if(!file || !file.type.startsWith("image/")){
    return;
  }

  const reader = new FileReader();

  reader.onload = ()=>{
    if(typeof reader.result!=="string"){
      return;
    }

    slip = {
      name:file.name,
      type:file.type,
      dataUrl:reader.result
    };

    localStorage.setItem("mayaGalNailsSlip",JSON.stringify(slip));
    render();
  };

  reader.readAsDataURL(file);
}

function saveStepImage(type,item){
  const keyMap = {
    shape:"mayaGalNailsStep1",
    color:"mayaGalNailsStep2",
    art:"mayaGalNailsStep3",
    accessory:"mayaGalNailsStep4"
  };

  const record = {
    step:type,
    id:item.id,
    name:item.name,
    image:item.image,
    savedAt:new Date().toISOString()
  };

  localStorage.setItem(keyMap[type],JSON.stringify(record));
}

function loadSavedData(){
  const storedSlip = localStorage.getItem("mayaGalNailsSlip");

  if(storedSlip){
    try{
      const parsed = JSON.parse(storedSlip);
      if(
        parsed &&
        typeof parsed.name==="string" &&
        typeof parsed.dataUrl==="string"
      ){
        slip = parsed;
      }
    }catch(error){
      slip = null;
    }
  }

  const keys = {
    shape:"mayaGalNailsStep1",
    color:"mayaGalNailsStep2",
    art:"mayaGalNailsStep3",
    accessory:"mayaGalNailsStep4"
  };

  Object.entries(keys).forEach(([type,key])=>{
    const saved = localStorage.getItem(key);

    if(!saved){
      return;
    }

    try{
      const parsed = JSON.parse(saved);
      const list = {
        shape:shapes,
        color:colors,
        art:arts,
        accessory:accessories
      }[type];

      const found = list.find(item=>item.id===parsed.id);
      if(found){
        design[type] = found;
      }
    }catch(error){
      // ใช้ค่าเริ่มต้นเมื่อข้อมูลเดิมไม่สมบูรณ์
    }
  });
}

function newDesign(){
  localStorage.removeItem("mayaGalNailsStep1");
  localStorage.removeItem("mayaGalNailsStep2");
  localStorage.removeItem("mayaGalNailsStep3");
  localStorage.removeItem("mayaGalNailsStep4");
  localStorage.removeItem("mayaGalNailsSlip");

  design = {
    shape:shapes[0],
    color:colors[0],
    art:arts[0],
    accessory:accessories[0]
  };

  slip = null;
  step = 1;
  render();
}

function escapeHtml(value){
  return value.replace(/[&<>"']/g,character=>{
    const entities = {
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    };
    return entities[character];
  });
}

loadSavedData();
render();
